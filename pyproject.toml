[project]
name = "refcheck"
version = "0.3.4"
description = "Find broken file references and fragile path patterns in codebases"
authors = [{ name = "Chris Birch", email = "datapointchris@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyselfupdate>=0.2.2",
]

[project.urls]
Repository = "https://github.com/datapointchris/refcheck"

[project.scripts]
refcheck = "refcheck.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.7.8",
    "mypy>=1.10.0",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]


# ---------- Tool Configurations ---------- #


[tool.bandit]
exclude_dirs = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "tests"]
skips = ["B404", "B603"]


[tool.codespell]
skip = "*.lock"
check-filenames = true


[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

# `standard` replaces the per-rule opt-outs repos used to accumulate; basedpyright
# defaults to `recommended`, which turns every one of them back on. Named
# `pyright` so both basedpyright and Pylance read it.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-vv"
minversion = "8.0"


[tool.refurb]
enable_all = true


[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "build(release): {version}"
# The package name is hardcoded on purpose. python-semantic-release sets no
# $PACKAGE_NAME, so `uv lock --upgrade-package "$PACKAGE_NAME"` silently no-ops
# and ships a stale lock file in the release commit.
build_command = """
    pip install uv
    uv lock --upgrade-package refcheck
    git add uv.lock
"""


# ---------- Build System ---------- #


[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true  # or pylance stops analyzing in vscode

[tool.forge]
# Keys the standard owns, written by `forge dies run maintenance/sync-pyproject.sh`.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["pytest", "ini_options", "addopts"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refcheck"]
